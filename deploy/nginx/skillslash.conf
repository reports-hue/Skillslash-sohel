# nginx reverse proxy for skillslash.com -> the Next.js container on
# 127.0.0.1:3000. Installed to /etc/nginx/sites-available/skillslash.conf
# and symlinked into sites-enabled by deploy/ec2-deploy.sh. The certbot
# --nginx run in that script rewrites the server{} block below to add the
# actual `listen 443 ssl;` + certificate directives (and a :80 -> :443
# redirect) - what's here is deliberately the *pre-SSL* HTTP-only config,
# since certbot needs a working HTTP vhost for it's own domain to issue
# against before it can add TLS.

# Upstream keeps the proxy_pass target in one place and gives nginx a named
# pool it can health-check/retry against instead of a bare address.
upstream skillslash_app {
  server 127.0.0.1:3000;
  keepalive 32;
}

server {
  listen 80;
  listen [::]:80;
  server_name skillslash.com www.skillslash.com;

  # Serves ACME HTTP-01 challenge files for certbot without proxying them
  # to the app - required for the first certificate issuance.
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  # gzip: cheap, real win on Lighthouse Performance for the large HTML/CSS/
  # JSON-LD payloads this app ships (course-comparison articles run long).
  gzip on;
  gzip_vary on;
  gzip_min_length 512;
  gzip_comp_level 6;
  gzip_types
    text/plain text/css text/xml application/xml application/xml+rss
    text/javascript application/javascript application/json
    image/svg+xml font/woff2;

  client_max_body_size 12m; # matches the 8MB editor-image cap with headroom

  # Next's own hashed, content-addressed build assets - safe to cache
  # forever; a new deploy ships new hashed filenames, never mutates these.
  location /_next/static/ {
    proxy_pass http://skillslash_app;
    proxy_set_header Host $host;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # Generated cover/placeholder SVGs and uploaded editor images - not
  # content-hashed, so a short cache plus revalidation instead of "immutable".
  location ~* ^/(covers|uploads|cdn)/ {
    proxy_pass http://skillslash_app;
    proxy_set_header Host $host;
    add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800" always;
  }

  location / {
    proxy_pass http://skillslash_app;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }

  access_log /var/log/nginx/skillslash.access.log;
  error_log  /var/log/nginx/skillslash.error.log;
}
